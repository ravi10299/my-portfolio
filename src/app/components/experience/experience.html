<section class="experience" id="experience" data-aos="fade-left">
  <div class="container">
    <span class="section-title"> Experience </span>

    <h2>Experience & Education</h2>

    <p class="subtitle">My professional journey.</p>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let item of timeline">
        <div class="circle"></div>

        <div class="content">
          <span class="year">
            {{ item.year }}
          </span>

          <h3>
            {{ item.title }}
          </h3>

          <h4>
            {{ item.company }}
          </h4>

          <ul>
            <li *ngFor="let point of item.description">
              {{ point }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
