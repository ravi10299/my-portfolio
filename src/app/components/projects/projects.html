<section class="projects" id="projects" data-aos="fade-up">
  <div class="container">
    <span class="section-title"> My Projects </span>

    <h2>Featured Projects</h2>

    <p class="subtitle">Some of my recent Full Stack Development projects.</p>

    <div class="project-grid">
      <div class="card" *ngFor="let project of projects">
        <img [src]="project.image" />

        <div class="content">
          <h3>{{ project.title }}</h3>

          <p>
            {{ project.description }}
          </p>

          <div class="badges">
            <span *ngFor="let item of project.tech">
              {{ item }}
            </span>
          </div>

          <div class="buttons">
            <a [href]="project.github" target="_blank"> GitHub </a>

            <a [href]="project.demo" target="_blank"> Live Demo </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
